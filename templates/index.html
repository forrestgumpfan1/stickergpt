<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StickerGPT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .answer-text { white-space: pre-wrap; overflow-wrap: anywhere; }
    .logo { width: 64px; height: auto; }
    @media (min-width: 576px) { .logo { width: 100px; } }
  </style>
</head>
<body class="bg-body-tertiary">
  <main class="container py-3 py-sm-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">

        <header class="d-flex align-items-center gap-3 mb-3 mb-sm-4">
          <img src="https://www.sjabr.org/uploaded/themes/default_18/images/footer_logo.png" alt="SJA logo" class="logo flex-shrink-0">
          <h1 class="h2 mb-0">StickerGPT</h1>
        </header>

        <form method="post" class="mb-4">
          <label for="question" class="visually-hidden">Question</label>
          <textarea id="question" name="question" rows="3" class="form-control mb-3" placeholder="Ask me anything from the SJA handbook....">{{ question or "" }}</textarea>
          <div class="d-grid d-sm-block">
            <button type="submit" class="btn btn-primary btn-lg px-sm-5">Ask</button>
          </div>
        </form>

        {% if question %}
          <p class="text-secondary" style="overflow-wrap: anywhere;"><strong>Question:</strong> {{ question }}</p>
        {% endif %}

        {% if answer %}
          <div class="card">
            <div class="card-body">
              <h2 class="h6 card-title">Answer</h2>
              <div class="answer-text">{{ answer }}</div>
            </div>
          </div>
        {% endif %}

      </div>
    </div>
  </main>
</body>
</html>
