<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>StickerGPT</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
    textarea { width: 100%; font-size: 1rem; }
    .answer { margin-top: 20px; padding: 15px; background: #f4f4f4; border-radius: 6px; white-space: pre-wrap; }
    .question { margin-top: 20px; color: #555; }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 15px;">
    <img src="https://www.sjabr.org/uploaded/themes/default_18/images/footer_logo.png" alt="SJA logo" style="max-width: 100px;">
    <h1 style="margin: 0;">StickerGPT</h1>
  </div>
  <form method="post">
    <textarea name="question" rows="3" placeholder="Ask me anything from the SJA handbook....">{{ question or "" }}</textarea>
    <br><br>
    <button type="submit">Ask</button>
  </form>

  {% if question %}
    <div class="question"><strong>Question:</strong> {{ question }}</div>
  {% endif %}

  {% if answer %}
    <div class="answer"><strong>Answer:</strong><br>{{ answer }}</div>
  {% endif %}
</body>
</html>
